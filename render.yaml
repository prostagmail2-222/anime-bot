services:
  - type: web
    name: animeuz-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /healthz
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_ID
        sync: false
      - key: DATABASE_PATH
        value: anime_bot.db
      - key: PYTHON_VERSION
        value: 3.11.9
